name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          mkdir -p www
          cp index.html www/index.html
          echo '{"appId":"com.example.alarm","appName":"Alarm","webDir":"www","android":{"backgroundColor":"#16202e"}}' > capacitor.config.json
          npx cap add android

      - name: Add alarm sound and permissions
        run: |
          python3 - <<'PY'
          import wave, struct, math, os
          sr = 22050
          def tone(f, d, v=0.6):
              n = int(sr * d)
              out = []
              for i in range(n):
                  env = min(1, i / (sr * 0.01)) * min(1, (n - i) / (sr * 0.03))
                  s = math.sin(2 * math.pi * f * i / sr) + 0.35 * math.sin(4 * math.pi * f * i / sr)
                  out.append(int(32767 * v * env * s / 1.35))
              return out
          def gap(d):
              return [0] * int(sr * d)
          burst = []
          for _ in range(4):
              burst += tone(988, 0.12) + gap(0.08) + tone(988, 0.12) + gap(0.08) + tone(988, 0.12) + gap(0.5)
          burst += gap(0.6)
          data = burst * 6
          os.makedirs('android/app/src/main/res/raw', exist_ok=True)
          with wave.open('android/app/src/main/res/raw/alarm.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h', x) for x in data))
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          extra = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % n for n in ['VIBRATE', 'SCHEDULE_EXACT_ALARM', 'USE_EXACT_ALARM', 'USE_FULL_SCREEN_INTENT'])
          s = s.replace('</manifest>', extra + '</manifest>')
          open(p, 'w').write(s)
          PY

      - name: Make alarms wake the phone
        run: |
          D=node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications
          sed -i 's/AlarmManager\.RTC,/AlarmManager.RTC_WAKEUP,/g' $D/LocalNotificationManager.java $D/TimedNotificationPublisher.java
          if grep -n "AlarmManager\.RTC," $D/*.java; then echo "Patch failed"; exit 1; fi
          grep -c "RTC_WAKEUP" $D/LocalNotificationManager.java $D/TimedNotificationPublisher.java

      - name: Use system alarm-clock alarms
        run: |
          python3 - <<'PY'
          D = 'node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/'
          SHOW = (
              'Intent showIntent = %(c)s.getPackageManager().getLaunchIntentForPackage(%(c)s.getPackageName());\n'
              'if (showIntent == null) { showIntent = new Intent(); }\n'
              'int showFlags = PendingIntent.FLAG_UPDATE_CURRENT;\n'
              'if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) { showFlags |= PendingIntent.FLAG_IMMUTABLE; }\n'
              'PendingIntent showPi = PendingIntent.getActivity(%(c)s, 0, showIntent, showFlags);\n'
              'alarmManager.setAlarmClock(new AlarmManager.AlarmClockInfo(trigger, showPi), pendingIntent);\n'
          )
          f = D + 'LocalNotificationManager.java'
          s = open(f).read()
          a = '    ) {\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !alarmManager.canScheduleExactAlarms()) {\n            Logger.warn('
          assert s.count(a) == 1
          s = s.replace(a, '    ) {\n        if (true) {\n' + SHOW % {'c': 'context'} + 'return;\n        }\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !alarmManager.canScheduleExactAlarms()) {\n            Logger.warn(')
          open(f, 'w').write(s)
          f = D + 'TimedNotificationPublisher.java'
          s = open(f).read()
          b = 'alarmManager.setExact(AlarmManager.RTC_WAKEUP, trigger, pendingIntent);'
          assert s.count(b) == 1
          s = s.replace(b, SHOW % {'c': 'context'})
          open(f, 'w').write(s)
          print('alarm-clock patch applied')
          PY

      - name: Make alarms turn the screen on
        run: |
          D=node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications
          sed -i 's/mBuilder\.setContentIntent(pendingIntent);/mBuilder.setContentIntent(pendingIntent); mBuilder.setFullScreenIntent(pendingIntent, true); mBuilder.setCategory(NotificationCompat.CATEGORY_ALARM);/' $D/LocalNotificationManager.java
          grep -c "setFullScreenIntent" $D/LocalNotificationManager.java | grep -qx 1 || { echo "Patch failed"; exit 1; }
          cat > android/app/src/main/java/com/example/alarm/MainActivity.java <<'JAVA'
          package com.example.alarm;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                      | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                      | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                  );
              }
          }
          JAVA

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
